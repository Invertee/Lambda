name: Lambda
version: "1.2.6"
slug: lambda
description: A private, block-based library for notes and reusable script snippets.
url: https://github.com/Invertee/Lambda
startup: application
boot: auto
init: false
arch:
  - aarch64
  - amd64
  - armv7
ingress: true
ingress_port: 8099
panel_icon: mdi:lambda
panel_title: Lambda
webui: http://[HOST]:[PORT:8099]
watchdog: http://[HOST]:[PORT:8099]/health
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Lambda web interface (for a reverse proxy)
map:
  - type: addon_config
    read_only: false
    path: /config
options:
  password: null
  api_key: null
  session_days: 30
schema:
  password: password
  api_key: password
  session_days: int(1,365)
